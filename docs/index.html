<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손글씨 숫자 인식 (PyTorch CNN)</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #3b82f6;
    --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --muted: #9a9a9e;
      --accent: #60a5fa;
      --border: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 48px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
    line-height: 1.5;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  #canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 12px;
    touch-action: none;
    cursor: crosshair;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  button {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }
  #clearBtn {
    background: var(--border);
    color: var(--text);
  }
  #predictBtn {
    background: var(--accent);
    color: #fff;
  }
  #predictBtn:disabled, #clearBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .result {
    text-align: center;
  }
  .result .digit {
    font-size: 72px;
    font-weight: 700;
    line-height: 1;
    margin: 8px 0;
    color: var(--accent);
  }
  .result .conf {
    color: var(--muted);
    font-size: 14px;
  }
  .bars {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .bar-row .label {
    width: 14px;
    text-align: right;
    color: var(--muted);
  }
  .bar-track {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
  }
  .bar-row .pct {
    width: 42px;
    text-align: right;
    color: var(--muted);
  }
  #status {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 16px;
    min-height: 18px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 24px;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>✍️ 손글씨 숫자 인식</h1>
  <p class="sub">PyTorch로 학습한 CNN을 ONNX로 변환해 브라우저(onnxruntime-web)에서 직접 실행합니다.
  숫자 하나를 아래 칸에 그려 보세요. 서버로 이미지가 전송되지 않고 이 기기 안에서만 계산됩니다.</p>

  <div id="status">모델을 불러오는 중...</div>

  <div class="card">
    <canvas id="canvas" width="280" height="280"></canvas>
    <div class="btn-row">
      <button id="clearBtn" disabled>지우기</button>
      <button id="predictBtn" disabled>인식하기</button>
    </div>
  </div>

  <div class="card result" id="resultCard" style="display:none;">
    <div class="conf">예측 결과</div>
    <div class="digit" id="digitOut">-</div>
    <div class="conf" id="confOut"></div>
    <div class="bars" id="barsOut"></div>
  </div>

  <footer>
    <a href="https://github.com/withsm77-blip/Study01_MNIST" target="_blank">GitHub 저장소 (Study01_MNIST)</a>
  </footer>
</div>

<script>
const statusEl = document.getElementById('status');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const clearBtn = document.getElementById('clearBtn');
const predictBtn = document.getElementById('predictBtn');
const resultCard = document.getElementById('resultCard');
const digitOut = document.getElementById('digitOut');
const confOut = document.getElementById('confOut');
const barsOut = document.getElementById('barsOut');

// 캔버스 초기화: 검은 배경 (MNIST 스타일)
function 캔버스_초기화() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 18;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
캔버스_초기화();

// ---- 그리기 처리 ----
let 그리는중 = false;
let 마지막 = null;

function 좌표_얻기(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const point = e.touches ? e.touches[0] : e;
  return {
    x: (point.clientX - rect.left) * scaleX,
    y: (point.clientY - rect.top) * scaleY,
  };
}

function 그리기_시작(e) {
  e.preventDefault();
  그리는중 = true;
  마지막 = 좌표_얻기(e);
}
function 그리기_중(e) {
  if (!그리는중) return;
  e.preventDefault();
  const 현재 = 좌표_얻기(e);
  ctx.beginPath();
  ctx.moveTo(마지막.x, 마지막.y);
  ctx.lineTo(현재.x, 현재.y);
  ctx.stroke();
  마지막 = 현재;
}
function 그리기_끝(e) {
  그리는중 = false;
}

canvas.addEventListener('mousedown', 그리기_시작);
canvas.addEventListener('mousemove', 그리기_중);
window.addEventListener('mouseup', 그리기_끝);
canvas.addEventListener('touchstart', 그리기_시작, { passive: false });
canvas.addEventListener('touchmove', 그리기_중, { passive: false });
canvas.addEventListener('touchend', 그리기_끝);

clearBtn.addEventListener('click', () => {
  캔버스_초기화();
  resultCard.style.display = 'none';
});

// ---- 전처리: mnist_predict.py 의 이미지_전처리 함수와 동일한 로직 ----
function 이미지_전처리() {
  const src = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const w = canvas.width, h = canvas.height;
  const gray = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    // 흰 선(R=G=B=255)의 밝기를 그대로 사용 (이미 검은 배경 + 흰 글씨)
    gray[i] = src.data[i * 4]; // R 채널
  }

  // 경계 상자 찾기
  let minX = w, maxX = -1, minY = h, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (gray[y * w + x] > 30) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null; // 그려진 것이 없음

  const boxW = maxX - minX + 1;
  const boxH = maxY - minY + 1;

  // 임시 캔버스에 경계 상자만큼 잘라내기
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = boxW;
  cropCanvas.height = boxH;
  const cropCtx = cropCanvas.getContext('2d');
  cropCtx.drawImage(canvas, minX, minY, boxW, boxH, 0, 0, boxW, boxH);

  // 긴 변이 20픽셀이 되도록 축소
  const scale = 20 / Math.max(boxW, boxH);
  const newW = Math.max(1, Math.round(boxW * scale));
  const newH = Math.max(1, Math.round(boxH * scale));
  const resizedCanvas = document.createElement('canvas');
  resizedCanvas.width = newW;
  resizedCanvas.height = newH;
  const resizedCtx = resizedCanvas.getContext('2d');
  resizedCtx.imageSmoothingEnabled = true;
  resizedCtx.drawImage(cropCanvas, 0, 0, newW, newH);
  const resizedData = resizedCtx.getImageData(0, 0, newW, newH);

  // 28x28 캔버스 중앙에 배치
  const canvas28 = new Float32Array(28 * 28);
  const offX = Math.floor((28 - newW) / 2);
  const offY = Math.floor((28 - newH) / 2);
  for (let y = 0; y < newH; y++) {
    for (let x = 0; x < newW; x++) {
      const v = resizedData.data[(y * newW + x) * 4]; // R 채널 (밝기)
      const ty = y + offY, tx = x + offX;
      if (ty >= 0 && ty < 28 && tx >= 0 && tx < 28) {
        canvas28[ty * 28 + tx] = v;
      }
    }
  }

  // 무게중심을 (14,14)로 이동
  let sum = 0, sumX = 0, sumY = 0;
  for (let y = 0; y < 28; y++) {
    for (let x = 0; x < 28; x++) {
      const v = canvas28[y * 28 + x];
      sum += v; sumX += v * x; sumY += v * y;
    }
  }
  const shifted = new Float32Array(28 * 28);
  if (sum > 0) {
    const cx = sumX / sum, cy = sumY / sum;
    const dx = Math.round(14 - cx), dy = Math.round(14 - cy);
    for (let y = 0; y < 28; y++) {
      for (let x = 0; x < 28; x++) {
        const sy = ((y - dy) % 28 + 28) % 28;
        const sx = ((x - dx) % 28 + 28) % 28;
        shifted[y * 28 + x] = canvas28[sy * 28 + sx];
      }
    }
  }

  // 0~1 정규화 후 MNIST 평균/표준편차로 정규화 (mnist_train.py 와 동일)
  const 평균 = 0.1307, 표준편차 = 0.3081;
  const out = new Float32Array(28 * 28);
  for (let i = 0; i < 28 * 28; i++) {
    out[i] = ((shifted[i] / 255.0) - 평균) / 표준편차;
  }
  return out;
}

function softmax(arr) {
  const max = Math.max(...arr);
  const exps = arr.map(v => Math.exp(v - max));
  const sum = exps.reduce((a, b) => a + b, 0);
  return exps.map(v => v / sum);
}

// ---- ONNX 모델 로드 ----
let session = null;
(async () => {
  try {
    session = await ort.InferenceSession.create('./mnist_cnn.onnx', {
      executionProviders: ['wasm'],
    });
    statusEl.textContent = '모델 로딩 완료! 숫자를 그려 보세요.';
    clearBtn.disabled = false;
    predictBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = '모델 로딩 실패: ' + err.message;
    console.error(err);
  }
})();

predictBtn.addEventListener('click', async () => {
  if (!session) return;
  const 입력 = 이미지_전처리();
  if (!입력) {
    statusEl.textContent = '먼저 숫자를 그려주세요.';
    return;
  }
  statusEl.textContent = '인식 중...';
  try {
    const tensor = new ort.Tensor('float32', 입력, [1, 1, 28, 28]);
    const results = await session.run({ input: tensor });
    const logits = Array.from(results.output.data);
    const probs = softmax(logits);

    let bestIdx = 0;
    for (let i = 1; i < 10; i++) if (probs[i] > probs[bestIdx]) bestIdx = i;

    digitOut.textContent = bestIdx;
    confOut.textContent = `확신도 ${(probs[bestIdx] * 100).toFixed(1)}%`;

    barsOut.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="label">${i}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(probs[i]*100).toFixed(1)}%"></div></div>
        <div class="pct">${(probs[i]*100).toFixed(1)}%</div>
      `;
      barsOut.appendChild(row);
    }

    resultCard.style.display = 'block';
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = '인식 실패: ' + err.message;
    console.error(err);
  }
});
</script>
</body>
</html>
